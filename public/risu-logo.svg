<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="50%" stop-color="#A45AFA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Glow Shield -->
    <path d="M50 5 L85 18 C85 65 50 88 50 95 C50 88 15 65 15 18 Z" fill="#0A0F24" stroke="url(#shieldGrad)" stroke-width="2.5" />
    <!-- Inner Shield Accent -->
    <path d="M50 12 L77 22 C77 58 50 78 50 84 C50 78 23 58 23 22 Z" fill="#131B3A" opacity="0.8" />
    
    <!-- Torch & Star of Skill -->
    <path d="M44 48 L56 48 L53 66 L47 66 Z" fill="url(#goldGrad)" />
    <!-- Flame -->
    <path d="M50 26 C53 32 58 35 55 42 C53 45 47 45 45 42 C42 35 47 32 50 26 Z" fill="#FF9900" filter="url(#glow)" />
    <path d="M50 30 C51.5 33 54 35 53 39 C52 41 48 41 47 39 C45 35 48 33 50 30 Z" fill="#FDE047" />

    <!-- Gear / Skill Rings -->
    <circle cx="50" cy="50" r="22" stroke="#A45AFA" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" />
    <circle cx="50" cy="50" r="14" stroke="#60A5FA" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Typography -->
  <!-- Primary University Acronym -->
  <text x="120" y="48" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="36" letter-spacing="2" fill="#FFFFFF">
    RISU
  </text>
  <rect x="230" y="24" width="75" height="22" rx="4" fill="#A45AFA" fill-opacity="0.2" stroke="#A45AFA" stroke-width="1" />
  <text x="267.5" y="39" font-family="system-ui, sans-serif" font-weight="700" font-size="10" letter-spacing="1.5" fill="#DDBEFF" text-anchor="middle">
    BHILAI
  </text>

  <!-- Full Name -->
  <text x="120" y="74" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="16" letter-spacing="0.5" fill="#F8FAFC">
    RUNGTA INTERNATIONAL SKILLS UNIVERSITY
  </text>

  <!-- Tagline / Subtitle -->
  <text x="120" y="94" font-family="system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1" fill="#94A3B8">
    DEPARTMENT OF COMPUTER SCIENCE &amp; CLOUD COMPUTING
  </text>
</svg>
