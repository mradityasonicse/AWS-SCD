<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <!-- Purple Chip Emblem -->
  <g transform="translate(15, 15) scale(1)" fill="#AD5CFF">
    <!-- Top Teeth -->
    <rect x="20" y="0" width="10" height="10" />
    <rect x="40" y="0" width="10" height="10" />
    <rect x="60" y="0" width="10" height="10" />
    <!-- Top Bar -->
    <rect x="20" y="10" width="50" height="10" />

    <!-- Bottom Bar -->
    <rect x="20" y="70" width="50" height="10" />
    <!-- Bottom Teeth -->
    <rect x="20" y="80" width="10" height="10" />
    <rect x="40" y="80" width="10" height="10" />
    <rect x="60" y="80" width="10" height="10" />

    <!-- Left Teeth -->
    <rect x="0" y="20" width="10" height="10" />
    <rect x="0" y="40" width="10" height="10" />
    <rect x="0" y="60" width="10" height="10" />
    <!-- Left Bar -->
    <rect x="10" y="20" width="10" height="50" />

    <!-- Right Bar -->
    <rect x="70" y="20" width="10" height="50" />
    <!-- Right Teeth -->
    <rect x="80" y="20" width="10" height="10" />
    <rect x="80" y="40" width="10" height="10" />
    <rect x="80" y="60" width="10" height="10" />
  </g>

  <!-- Typography -->
  <text x="125" y="48" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="2" fill="#FFFFFF">
    RISU
  </text>
  <rect x="225" y="24" width="75" height="22" rx="4" fill="#AD5CFF" fill-opacity="0.2" stroke="#AD5CFF" stroke-width="1" />
  <text x="262.5" y="39" font-family="system-ui, sans-serif" font-weight="700" font-size="10" letter-spacing="1.5" fill="#DDBEFF" text-anchor="middle">
    BHILAI
  </text>

  <!-- Full Name -->
  <text x="125" y="74" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="16" letter-spacing="0.5" fill="#F8FAFC">
    RUNGTA INTERNATIONAL SKILLS UNIVERSITY
  </text>

  <!-- Tagline / Subtitle -->
  <text x="125" y="94" font-family="system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1" fill="#94A3B8">
    DEPARTMENT OF COMPUTER SCIENCE &amp; CLOUD COMPUTING
  </text>
</svg>
